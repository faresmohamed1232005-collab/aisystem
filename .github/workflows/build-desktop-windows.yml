name: Build Desktop Windows

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'رقم الإصدار (مثال 1.1.1). يُستخدم كوسم الإصدار v<الرقم> ونسخة التطبيق.'
        required: false
        default: '1.1.0'

# نحتاج صلاحية الكتابة لإنشاء GitHub Release ورفع المثبّت كأصل بتحميل مباشر.
permissions:
  contents: write

concurrency:
  group: desktop-windows-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-windows:
    name: Build Windows x64 installer
    runs-on: windows-latest
    timeout-minutes: 90

    steps:
      - name: Checkout selected commit
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, openssl, pdo_sqlite, sqlite3, fileinfo, curl, zip
          tools: composer:v2
          coverage: none

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Create isolated desktop environment
        shell: pwsh
        run: |
          @'
          APP_NAME="Pharmacy Management System"
          APP_ENV=production
          APP_KEY=
          APP_DEBUG=false
          APP_URL=http://localhost
          LOG_CHANNEL=stderr

          DB_CONNECTION=sqlite
          DB_DATABASE=:memory:

          CACHE_STORE=array
          SESSION_DRIVER=array
          QUEUE_CONNECTION=sync

          BRANCH_ID=
          BRANCH_CODE=
          SYNC_ENABLED=false
          SYNC_SERVER_URL=
          SYNC_TOKEN=

          NATIVEPHP_APP_ID=com.pharmacy.pos
          NATIVEPHP_APP_VERSION=${{ github.event.inputs.version || '1.1.0' }}
          NATIVEPHP_APP_AUTHOR="Pharmacy System"
          NATIVEPHP_APP_DESCRIPTION="Pharmacy Management System"
          NATIVEPHP_UPDATER_ENABLED=false
          GITHUB_OWNER=
          GITHUB_REPO=
          GITHUB_TOKEN=
          '@ | Set-Content -Path .env.desktop-build -Encoding utf8

      - name: Install PHP dependencies
        env:
          # وثّق composer بـ GITHUB_TOKEN حتى تُحمَّل حزم dist عبر طلبات موثّقة (حد 5000/ساعة
          # بدل 60 للمجهول) — يزيل أخطاء 429 (Too Many Requests) من codeload.github.com.
          COMPOSER_AUTH: '{"github-oauth": {"github.com": "${{ secrets.GITHUB_TOKEN }}"}}'
          # قلّل التنزيلات المتوازية لتفادي سباق الملفات المؤقتة (Permission denied) وحدود المعدّل.
          COMPOSER_MAX_PARALLEL_HTTP: '6'
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Generate temporary application key
        shell: pwsh
        run: |
          php artisan key:generate --env=desktop-build --force --no-interaction
          $appKey = Get-Content .env.desktop-build |
              Where-Object { $_ -like 'APP_KEY=*' } |
              Select-Object -First 1
          if (-not $appKey -or $appKey -eq 'APP_KEY=') {
              throw 'Failed to generate the temporary APP_KEY.'
          }
          $appKey | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend assets
        run: npm run build

      - name: Run application tests
        run: php artisan test

      - name: Run desktop build guard
        run: php artisan desktop:build-guard --env=desktop-build

      - name: Validate route cache (fail early on duplicate route names)
        run: |
          php artisan route:cache --env=desktop-build
          php artisan route:clear

      - name: Build Windows installer
        run: php artisan native:build win x64 --env=desktop-build --no-interaction

      - name: Verify installer and create checksum
        shell: pwsh
        run: |
          $installers = @(Get-ChildItem -Path nativephp/electron/dist -Filter '*-setup.exe' -File)
          if ($installers.Count -eq 0) {
              throw 'NativePHP did not produce a Windows setup executable.'
          }

          $checksumPath = Join-Path $installers[0].DirectoryName 'SHA256SUMS.txt'
          $checksumLines = foreach ($installer in $installers) {
              if ($installer.Length -eq 0) {
                  throw "Installer is empty: $($installer.FullName)"
              }

              $hash = (Get-FileHash -Path $installer.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
              "$hash  $($installer.Name)"
          }
          $checksumLines | Set-Content -Path $checksumPath -Encoding ascii

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: pharmacy-desktop-windows-x64-${{ github.sha }}
          path: |
            nativephp/electron/dist/*-setup.exe
            nativephp/electron/dist/*.yml
            nativephp/electron/dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14

      # ينشر المثبّت كأصل في GitHub Release باسم ثابت، فيصبح للموقع رابط تحميل مباشر دائم:
      #   https://github.com/<owner>/<repo>/releases/latest/download/Pharmacy-Management-System-Setup.exe
      # (يعمل للعامة فقط لو المستودع public؛ للمستودع الخاص يتطلب مصادقة.)
      - name: Publish GitHub Release (stable direct-download link)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APP_VERSION: ${{ github.event.inputs.version || '1.1.0' }}
        shell: pwsh
        run: |
          $dist = 'nativephp/electron/dist'
          $installer = Get-ChildItem -Path $dist -Filter '*-setup.exe' -File | Select-Object -First 1
          if (-not $installer) { throw 'No setup.exe found to release.' }

          # اسم ثابت للأصل حتى يبقى رابط التحميل المباشر ثابتاً عبر كل الإصدارات.
          $stableName = 'Pharmacy-Management-System-Setup.exe'
          $stablePath = Join-Path $dist $stableName
          Copy-Item -Path $installer.FullName -Destination $stablePath -Force

          $tag = "v$env:APP_VERSION"
          $checksums = Join-Path $dist 'SHA256SUMS.txt'

          # أنشئ الإصدار إن لم يكن موجوداً، ثم ارفع/استبدل الأصول (--clobber).
          gh release view $tag 2>$null
          if ($LASTEXITCODE -ne 0) {
              gh release create $tag --target $env:GITHUB_SHA `
                  --title "Pharmacy Desktop v$env:APP_VERSION" `
                  --notes "نسخة سطح المكتب لنظام إدارة الصيدلية (Windows x64). حمّل المثبّت من الأصول بالأسفل."
          }
          gh release upload $tag $stablePath $checksums --clobber

          Write-Host "رابط التحميل المباشر (أحدث إصدار دائماً):"
          Write-Host "https://github.com/${{ github.repository }}/releases/latest/download/$stableName"
